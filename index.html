
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVRS - Visitor Registration</title>

<style>
* {
    box-sizing: border-box;
}

[hidden] {
    display: none !important;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #253b32;
}

.container {
    width: 92%;
    max-width: 520px;
    margin: 40px auto;
    text-align: center;
}

header h1 {
    font-size: 42px;
    color: #28664a;
    margin-bottom: 8px;
}

header p {
    color: #66776d;
}

.card {
    background: white;
    padding: 25px 20px;
    margin-top: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.top-nav {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 25px;
}

button, .upload-label {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #28664a;
    color: white;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
}

.secondary, .upload-label {
    background: #e5eee8;
    color: #28664a;
}

.nav-btn {
    width: auto;
    margin: 0;
    padding: 10px 14px;
    background: #e5eee8;
    color: #28664a;
    font-size: 14px;
}

.back-btn {
    background: transparent;
    color: #28664a;
    text-align: left;
    padding: 10px 0;
    margin: 0 0 20px;
    font-size: 14px;
}

video, #preview {
    display: block;
    width: 100%;
    max-height: 380px;
    object-fit: contain;
    border-radius: 10px;
    margin: 15px auto;
    background: #e5eee8;
}

#message {
    color: #28664a;
    margin-top: 20px;
    overflow-wrap: anywhere;
}

.empty-state {
    background: #f4f7f5;
    padding: 30px 15px;
    border-radius: 12px;
    margin-top: 20px;
}

footer {
    margin-top: 35px;
    color: #88978d;
    font-size: 13px;
}

@media (max-width: 480px) {
    .container {
        margin: 20px auto;
    }

    .card {
        padding: 20px 15px;
    }
}
</style>
</head>

<body>
<main class="container">

<header>
    <h1>SVRS</h1>
    <p>Smart Visitor Registration System</p>
</header>

<!-- MAIN SCANNER PAGE -->
<section id="scanPage" class="card">

    <nav class="top-nav">
        <button id="goRecordsBtn"
                class="nav-btn"
                type="button">
            View Visitor Records
        </button>
    </nav>

    <h2>Visitor IC Scanner</h2>
    <p>Scan or upload a visitor's IC.</p>

    <video id="camera"
           autoplay
           playsinline
           muted
           hidden></video>

    <canvas id="canvas" hidden></canvas>

    <img id="preview"
         alt="Captured image"
         hidden>

    <button id="scanBtn" type="button">
        Open Camera
    </button>

    <button id="captureBtn"
            type="button"
            hidden>
        Capture IC
    </button>

    <button id="stopBtn"
            class="secondary"
            type="button"
            hidden>
        Close Camera
    </button>

    <label for="uploadInput" class="upload-label">
        Upload IC Image
    </label>

    <input id="uploadInput"
           type="file"
           accept="image/*"
           hidden>

    <p id="message" role="status"></p>

</section>

<!-- VISITOR RECORDS PAGE -->
<section id="recordsPage" class="card" hidden>

    <button id="backRecordsBtn"
            class="back-btn"
            type="button">
        ← Back to Scanner
    </button>

    <h2>Visitor Records</h2>

    <div class="empty-state">
        <p>No visitor records yet.</p>
        <small>
            Registration and Excel export
            will be added in later phases.
        </small>
    </div>

</section>

<footer>SVRS | Internship Project</footer>

</main>

<script>
"use strict";

// Get page elements
const scanPage = document.getElementById("scanPage");
const recordsPage = document.getElementById("recordsPage");

const goRecordsBtn = document.getElementById("goRecordsBtn");
const backRecordsBtn = document.getElementById("backRecordsBtn");

const camera = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");

const scanBtn = document.getElementById("scanBtn");
const captureBtn = document.getElementById("captureBtn");
const stopBtn = document.getElementById("stopBtn");
const uploadInput = document.getElementById("uploadInput");
const message = document.getElementById("message");

let stream = null;
let imageURL = null;
let cameraRequest = 0;

// Stop camera safely
function stopCamera() {
    cameraRequest++;

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    camera.pause();
    camera.srcObject = null;
    camera.hidden = true;

    scanBtn.hidden = false;
    captureBtn.hidden = true;
    stopBtn.hidden = true;
}

// Clear previous image
function clearPreview() {
    if (imageURL) {
        URL.revokeObjectURL(imageURL);
        imageURL = null;
    }

    preview.removeAttribute("src");
    preview.hidden = true;
}

// OPEN CAMERA
scanBtn.addEventListener("click", async function() {
    const requestId = ++cameraRequest;

    message.textContent = "Opening camera...";
    clearPreview();

    try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
            throw new Error(
                "Camera requires HTTPS or localhost."
            );
        }

        const newStream =
            await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: { ideal: "environment" }
                }
            });

        // Ignore an outdated request
        if (requestId !== cameraRequest) {
            newStream.getTracks().forEach(
                track => track.stop()
            );
            return;
        }

        stream = newStream;
        camera.srcObject = stream;
        camera.hidden = false;

        await camera.play();

        if (requestId !== cameraRequest) return;

        scanBtn.hidden = true;
        captureBtn.hidden = false;
        stopBtn.hidden = false;

        message.textContent = "Camera ready!";

    } catch (error) {
        if (requestId !== cameraRequest) return;

        stopCamera();
        message.textContent =
            "Camera error: " + error.message;

        console.error(error);
    }
});

// CAPTURE IMAGE
captureBtn.addEventListener("click", function() {
    if (!stream || !camera.videoWidth) {
        message.textContent = "Camera is not ready.";
        return;
    }

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0);

    clearPreview();

    preview.src = canvas.toDataURL("image/jpeg", 0.9);
    preview.hidden = false;

    stopCamera();

    message.textContent =
        "Image captured successfully!";
});

// CLOSE CAMERA
stopBtn.addEventListener("click", function() {
    stopCamera();
    message.textContent = "Camera closed.";
});

// UPLOAD IMAGE
uploadInput.addEventListener("change", function() {
    const file = uploadInput.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        message.textContent =
            "Please select an image file.";
        return;
    }

    stopCamera();
    clearPreview();

    imageURL = URL.createObjectURL(file);

    preview.src = imageURL;
    preview.hidden = false;

    message.textContent =
        "Image uploaded successfully!";
});

// OPEN VISITOR RECORDS
goRecordsBtn.addEventListener("click", function() {
    stopCamera();
    clearPreview();

    scanPage.hidden = true;
    recordsPage.hidden = false;
});

// BACK TO SCANNER
backRecordsBtn.addEventListener("click", function() {
    recordsPage.hidden = true;
    scanPage.hidden = false;

    message.textContent = "";
});

// Release camera when leaving
window.addEventListener("pagehide", stopCamera);

console.log("SVRS ready.");
</script>

</body>
</html>
